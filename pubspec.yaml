name: archespace_mobile
description: Arche Space mobile app (Flutter). Currently the crypto-contract spike.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # arc1 crypto port: Argon2id + AES-GCM (pure Dart).
  cryptography: ^2.7.0
  # Same backend as the web app (Auth, Postgres, RLS, Realtime).
  supabase_flutter: ^2.8.0
  # Biometric gate + OS keystore for the vault key.
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Markdown rendering for the Markdown item type.
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
